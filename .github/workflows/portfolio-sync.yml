name: Portfolio sync

on:
  workflow_dispatch:
  # Optional schedule example (UTC). Uncomment and adjust for your timezone.
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application
        run: python -m pip install .

      - name: Update read-only snapshot
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
        run: python -m trading212_sync

      - name: Commit snapshot if changed
        shell: bash
        run: |
          if git diff --quiet -- portfolio/latest.json; then
            echo "Portfolio snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- portfolio/latest.json
          git commit -m "chore: update portfolio snapshot"
          git push

