name: Portfolio sync

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Two entries cover 17:50 London in GMT and BST;
    # the gate step below selects the correct one for the current UK offset.
    - cron: "50 16 * * *"
    - cron: "50 17 * * *"

permissions:
  contents: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Determine whether this is the London 17:50 run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          should_run=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_run=true
          else
            london_offset="$(TZ=Europe/London date +%z)"
            if [[ "$SCHEDULE" == "50 16 * * *" && "$london_offset" == "+0100" ]]; then
              should_run=true
            elif [[ "$SCHEDULE" == "50 17 * * *" && "$london_offset" == "+0000" ]]; then
              should_run=true
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install .

      - name: Update read-only snapshot
        if: steps.gate.outputs.should_run == 'true'
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
        run: python -m trading212_sync

      - name: Commit snapshot if changed
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- portfolio/latest.json; then
            echo "Portfolio snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- portfolio/latest.json
          git commit -m "chore: update portfolio snapshot"
          git push

